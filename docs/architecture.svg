<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1160" viewBox="0 0 960 1160" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:1.5;rx:8}
      .llm{fill:#eef2ff;stroke:#4f46e5}
      .tool{fill:#ecfdf5;stroke:#047857}
      .val{fill:#fffbeb;stroke:#b45309}
      .rec{fill:#fef2f2;stroke:#b91c1c}
      .out{fill:#f1f5f9;stroke:#334155}
      .t{font-size:15px;font-weight:600;fill:#0f172a;text-anchor:middle}
      .s{font-size:12px;fill:#334155;text-anchor:middle}
      .n{font-size:11.5px;fill:#475569}
      .e{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .er{stroke:#b91c1c;stroke-width:1.6;fill:none;marker-end:url(#r)}
      .d{stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="960" height="1160" fill="#ffffff"/>
  <text x="480" y="30" class="t" style="font-size:19px">Competitive Intelligence Agent - components and control flow</text>

  <!-- main column -->
  <rect x="330" y="50" width="300" height="46" class="box"/>
  <text x="480" y="71" class="t">User goal (CLI: main.py)</text>
  <text x="480" y="88" class="s">natural-language request</text>

  <rect x="330" y="120" width="300" height="46" class="box"/>
  <text x="480" y="141" class="t">Agent Controller</text>
  <text x="480" y="158" class="s">agent.py - wiring, run lifecycle, outputs</text>

  <rect x="330" y="190" width="300" height="56" class="box llm"/>
  <text x="480" y="212" class="t">Planner</text>
  <text x="480" y="229" class="s">goal -> Objective -> Plan (Pydantic-validated)</text>
  <text x="480" y="242" class="s">local Qwen (Ollama) | retry w/ error | template</text>

  <rect x="330" y="270" width="300" height="46" class="box"/>
  <text x="480" y="291" class="t">Execution Plan (printed)</text>
  <text x="480" y="308" class="s">visible task list + tools, before acting</text>

  <rect x="330" y="340" width="300" height="46" class="box"/>
  <text x="480" y="361" class="t">Task Executor</text>
  <text x="480" y="378" class="s">sequential, one handler per task type</text>

  <rect x="330" y="410" width="300" height="46" class="box"/>
  <text x="480" y="431" class="t">Tool Router</text>
  <text x="480" y="448" class="s">name -> primary tool + ordered fallbacks</text>

  <!-- tools -->
  <rect x="60" y="490" width="250" height="62" class="box tool"/>
  <text x="185" y="512" class="t">web_search</text>
  <text x="185" y="529" class="s">Tavily | DuckDuckGo | Bing RSS</text>
  <text x="185" y="545" class="s">| Synthetic (offline)</text>
  <rect x="355" y="490" width="250" height="62" class="box tool"/>
  <text x="480" y="512" class="t">url_fetcher</text>
  <text x="480" y="529" class="s">URL/SSRF check, timeout, size cap,</text>
  <text x="480" y="545" class="s">content-type, HTML -> text</text>
  <rect x="650" y="490" width="250" height="62" class="box tool"/>
  <text x="775" y="512" class="t">calculator</text>
  <text x="775" y="529" class="s">safe AST arithmetic (no eval)</text>
  <text x="775" y="545" class="s">metrics from figures in sources</text>
  <rect x="40" y="478" width="880" height="86" fill="none" stroke="#94a3b8" stroke-width="1.2" class="d" rx="10"/>
  <text x="650" y="614" class="n">dashed frame: optional FaultInjectingTool</text><text x="650" y="628" class="n">(--inject-failure; validator is not told)</text>

  <rect x="330" y="596" width="300" height="46" class="box val"/>
  <text x="480" y="617" class="t">Result Validator</text>
  <text x="480" y="634" class="s">status, fields, types, empty, URLs, finite</text>

  <polygon points="480,666 560,706 480,746 400,706" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="480" y="711" class="t">valid?</text>

  <!-- recovery -->
  <rect x="40" y="664" width="280" height="118" class="box rec"/>
  <text x="180" y="684" class="t">Recovery Manager + Re-planner</text>
  <text x="180" y="702" class="s">1. retry (backoff) if retryable</text>
  <text x="180" y="718" class="s">2. fallbacks: backup provider,</text>
  <text x="180" y="734" class="s">simplified query, search snippet</text>
  <text x="180" y="750" class="s">3. LLM re-plan: new query from failure</text><text x="180" y="766" class="s">4. graceful failure, run continues</text>

  <rect x="330" y="790" width="300" height="46" class="box"/>
  <text x="480" y="811" class="t">Execution State</text>
  <text x="480" y="828" class="s">sources, metrics, tool calls, events</text>

  <rect x="330" y="860" width="300" height="56" class="box llm"/>
  <text x="480" y="882" class="t">Synthesizer</text>
  <text x="480" y="899" class="s">Qwen JSON | extractive fallback</text>
  <text x="480" y="912" class="s">citations enforced against real source ids</text>

  <rect x="330" y="940" width="300" height="46" class="box"/>
  <text x="480" y="961" class="t">Report Generator</text>
  <text x="480" y="978" class="s">reporter.py - RunReport + Markdown</text>

  <rect x="250" y="1010" width="460" height="46" class="box out"/>
  <text x="480" y="1031" class="t">report.json  |  report.md  |  trace.jsonl</text>
  <text x="480" y="1048" class="s">runs/&lt;timestamp&gt;_&lt;goal&gt;/</text>

  <!-- edges main -->
  <path d="M480,96 V118" class="e"/>
  <path d="M480,166 V188" class="e"/>
  <path d="M480,246 V268" class="e"/>
  <path d="M480,316 V338" class="e"/>
  <path d="M480,386 V408" class="e"/>
  <path d="M430,456 L185,488" class="e"/>
  <path d="M480,456 V488" class="e"/>
  <path d="M530,456 L775,488" class="e"/>
  <path d="M185,552 L430,594" class="e"/>
  <path d="M480,552 V594" class="e"/>
  <path d="M775,552 L530,594" class="e"/>
  <path d="M480,642 V664" class="e"/>
  <path d="M480,746 V788" class="e"/>
  <text x="490" y="770" class="n">yes</text>
  <path d="M400,706 H322" class="er"/>
  <text x="340" y="698" class="n" style="fill:#b91c1c">no</text>
  <path d="M40,700 H20 V433 H328" class="er d"/>
  <text x="60" y="426" class="n" style="fill:#b91c1c">retry / fallback call</text>
  <path d="M180,782 V813 H328" class="er d"/>
  <text x="190" y="806" class="n" style="fill:#b91c1c">gave up: recorded</text>
  <path d="M630,813 H940 V363 H632" class="e d"/>
  <text x="870" y="805" class="n">next task</text>
  <path d="M480,836 V858" class="e"/>
  <path d="M480,916 V938" class="e"/>
  <path d="M480,986 V1008" class="e"/>

  <!-- legend -->
  <rect x="40" y="1080" width="14" height="14" style="rx:3" class="box llm"/><text x="60" y="1092" class="n">LLM brain: local Qwen via Ollama (deterministic fallback)</text>
  <rect x="440" y="1080" width="14" height="14" style="rx:3" class="box tool"/><text x="460" y="1092" class="n">tools</text>
  <rect x="510" y="1080" width="14" height="14" style="rx:3" class="box val"/><text x="530" y="1092" class="n">validation</text>
  <rect x="610" y="1080" width="14" height="14" style="rx:3" class="box rec"/><text x="630" y="1092" class="n">recovery</text>
  <text x="40" y="1122" class="n">Deterministic Python owns tool execution, validation, retries, timeouts, state, arithmetic and logging.</text>
  <text x="40" y="1140" class="n">The LLM interprets the goal, plans, re-plans failed searches, extracts figures (grounding-checked; Python derives metrics) and writes the synthesis.</text>
</svg>
